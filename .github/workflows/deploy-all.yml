name: Deploy Everything

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      has_supabase_token: ${{ steps.secrets.outputs.has_supabase_token }}
    steps:
      - name: Check deploy credentials
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN. Backend migrations/functions will be skipped; Vercel/Render deploys and health checks still continue."
            echo "has_supabase_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_supabase_token=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  run-migrations:
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_supabase_token == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply all pending SQL migrations
        run: |
          supabase db push --project-ref rueaxiyvseaxkysnoock --include-all --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  deploy-edge-functions:
    runs-on: ubuntu-latest
    needs: [preflight, run-migrations]
    if: needs.preflight.outputs.has_supabase_token == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Supabase edge functions
        run: supabase functions deploy --project-ref rueaxiyvseaxkysnoock
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  health-check:
    runs-on: ubuntu-latest
    needs: [preflight, run-migrations, deploy-edge-functions]
    if: always() && !cancelled()
    steps:
      - name: Wait for Vercel + Render
        run: |
          for i in 1 2 3 4 5 6 7 8 9; do
            echo "Waiting for deploy propagation... $((i * 5))s"
            sleep 5
          done

      - name: Report backend deploy status
        run: |
          if [ "${{ needs.preflight.outputs.has_supabase_token }}" != "true" ]; then
            echo "::warning::Backend deploy was skipped because SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions. Add the repository secret to deploy migrations and edge functions from GitHub."
          else
            echo "Backend deploy credentials present."
          fi

      - name: Check all platforms
        run: |
          check_http() {
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$1" --max-time 15 || echo "000")
            echo "$2 → $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -gt 399 ]; then
              echo "::warning::$2 returned HTTP $STATUS"
            fi
          }
          check_http "https://www.aiqtp.com"                                "www.aiqtp.com (Vercel)"
          check_http "https://aiqtp-trading-service.onrender.com/health"   "trading-service (Render)"
          check_http "https://aiqtp-quantum-agent.onrender.com/health"     "quantum-agent (Render)"
          echo "✅ Deploy complete — all platforms synced from GitHub main"
