name: Deploy Everything

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint && bun run typecheck && bun run build && bun run test:security

  preflight:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - name: Check deploy credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN; refusing a partial deployment."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing SUPABASE_PROJECT_ID; refusing an implicit deployment target."
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  run-migrations:
    runs-on: ubuntu-latest
    needs: preflight
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply all pending SQL migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --include-all --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  deploy-edge-functions:
    runs-on: ubuntu-latest
    needs: [preflight, run-migrations]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Supabase edge functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

  health-check:
    runs-on: ubuntu-latest
    needs: [preflight, run-migrations, deploy-edge-functions]
    if: success()
    steps:
      - name: Wait for Vercel + Render
        run: |
          for i in 1 2 3 4 5 6 7 8 9; do
            echo "Waiting for deploy propagation... $((i * 5))s"
            sleep 5
          done

      - name: Check all platforms
        run: |
          check_http() {
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$1" --max-time 15 || echo "000")
            echo "$2 → $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -gt 399 ]; then
              echo "::error::$2 returned HTTP $STATUS"
              return 1
            fi
          }
          check_http "https://www.aiqtp.com"                                "www.aiqtp.com (Vercel)"
          check_http "https://aiqtp-trading-service.onrender.com/health"   "trading-service (Render)"
          check_http "https://aiqtp-quantum-agent.onrender.com/health"     "quantum-agent (Render)"
          echo "Deploy complete — all required health checks passed"
