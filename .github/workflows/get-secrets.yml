name: Get Project Secrets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/get-secrets.yml'
jobs:
  get-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Verify backend management token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured; skipping backend config check."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check backend project settings without printing secrets
        if: steps.token.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for endpoint in postgrest auth; do
            status=$(curl -s -o /tmp/${endpoint}.json -w "%{http_code}" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/rueaxiyvseaxkysnoock/config/${endpoint}")
            echo "${endpoint} config endpoint → HTTP ${status}"
            if [ "$status" -lt 200 ] || [ "$status" -gt 299 ]; then
              echo "::warning::Could not read ${endpoint} config."
            fi
            rm -f /tmp/${endpoint}.json
          done
