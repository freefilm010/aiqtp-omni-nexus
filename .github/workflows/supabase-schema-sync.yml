name: Supabase Schema Sync

on:
  # Run weekly to capture any schema changes made via Supabase dashboard
  schedule:
    - cron: "0 4 * * 1"   # Monday 04:00 UTC
  workflow_dispatch:       # manual trigger anytime

jobs:
  sync-schema:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Check backend management token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not configured; skipping schema sync."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.enabled == 'true'
        with:
          version: latest

      - name: Pull live DB schema
        if: steps.token.outputs.enabled == 'true'
        run: |
          supabase db pull \
            --project-ref rueaxiyvseaxkysnoock \
            --schema public,auth,storage,extensions \
            --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Check for schema drift
        id: drift
        if: steps.token.outputs.enabled == 'true'
        run: |
          git diff --quiet supabase/migrations/ && \
            echo "drift=false" >> "$GITHUB_OUTPUT" || \
            echo "drift=true" >> "$GITHUB_OUTPUT"

      - name: Open schema sync pull request if needed
        if: steps.token.outputs.enabled == 'true' && steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="automation/schema-sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add supabase/migrations/
          git commit -m "chore: sync Supabase schema from live project [auto]

          Schema pulled from rueaxiyvseaxkysnoock.supabase.co
          Any dashboard-applied migrations captured here."
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: sync backend schema" \
            --body "Automated schema drift capture. Review before merging to main."

      - name: Report sync status
        if: always()
        run: |
          if [ "${{ steps.token.outputs.enabled }}" != "true" ]; then
            echo "⚠️ Schema sync skipped — missing SUPABASE_ACCESS_TOKEN"
          elif [ "${{ steps.drift.outputs.drift }}" = "true" ]; then
            echo "✅ Schema drift detected and pull request opened"
          else
            echo "✅ Schema is in sync — no changes needed"
          fi
