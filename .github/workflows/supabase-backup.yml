name: Supabase Full Backup

on:
  schedule:
    - cron: "0 3 * * *"   # Daily 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require backup credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD BACKUP_ENCRYPTION_KEY BACKUP_S3_BUCKET; do
            test -n "${!name}" || { echo "::error::Missing required backup secret: $name"; exit 1; }
          done

      - name: Create database and source backups
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p backup
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --linked --file backup/database.sql
          tar -czf backup/functions-and-migrations.tar.gz supabase/functions supabase/migrations

      - name: Encrypt and checksum backups
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          for source in backup/database.sql backup/functions-and-migrations.tar.gz; do
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -in "$source" -out "$source.enc" -pass env:BACKUP_ENCRYPTION_KEY
            sha256sum "$source.enc" >> backup/SHA256SUMS
            rm "$source"
          done

      - name: Upload encrypted backup and verify checksums
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" || { echo "::error::Missing BACKUP_S3_ACCESS_KEY_ID"; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo "::error::Missing BACKUP_S3_SECRET_ACCESS_KEY"; exit 1; }
          test -n "$AWS_ENDPOINT_URL" || { echo "::error::Missing BACKUP_S3_ENDPOINT"; exit 1; }
          PREFIX="aiqtp/$(date -u +%Y/%m/%d)/${GITHUB_RUN_ID}"
          aws s3 cp backup/ "s3://${BACKUP_S3_BUCKET}/${PREFIX}/" --recursive --endpoint-url "$AWS_ENDPOINT_URL"
          mkdir -p restore-check
          aws s3 cp "s3://${BACKUP_S3_BUCKET}/${PREFIX}/" restore-check/ --recursive --endpoint-url "$AWS_ENDPOINT_URL"
          (cd restore-check && sha256sum -c SHA256SUMS)
